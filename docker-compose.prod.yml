# docker-compose.prod.yml
# Use this for cloud/Railway deployment.
# The Docker socket mount is removed — the sandbox judge is disabled in this mode.
# All secrets are read from environment variables (set in Railway dashboard).
#
# Local dev:    docker-compose up -d
# Production:   docker-compose -f docker-compose.prod.yml up -d

name: codeforge

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-codeforge}
    volumes:
      - codeforge_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - codeforge_redis_data:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL}
      - SECRET_KEY=${SECRET_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - JUDGE_DISABLED=true
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    # NOTE: /var/run/docker.sock is intentionally NOT mounted.
    # The judge requires Docker-in-Docker which is NOT supported on Railway.
    # Use a VPS (DigitalOcean/Hetzner) + docker-compose.yml to enable it.

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000/api/v1}
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

  admin_dashboard:
    build:
      context: ./admin_dashboard
      dockerfile: Dockerfile
    restart: always
    environment:
      - DATABASE_URL=${DATABASE_URL}
    ports:
      - "8501:8501"
    depends_on:
      - db

volumes:
  codeforge_postgres_data:
  codeforge_redis_data:
