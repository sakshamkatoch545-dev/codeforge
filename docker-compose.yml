services:
  db:
    image: postgres:15-alpine
    container_name: codeforge_db
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-codeforge}
    ports:
      - "5432:5432"
    volumes:
      - codeforge_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: codeforge_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - codeforge_redis_data:/data

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: codeforge_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-codeforge}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-your-super-secret-key-change-in-production}
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codeforge_frontend
    restart: always
    environment:
      - BACKEND_URL=http://backend:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

  admin_dashboard:
    build:
      context: ./admin_dashboard
      dockerfile: Dockerfile
    container_name: codeforge_admin
    restart: always
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-codeforge}
    ports:
      - "8501:8501"
    depends_on:
      - db

volumes:
  codeforge_postgres_data:
  codeforge_redis_data:
